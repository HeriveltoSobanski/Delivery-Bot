name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Create .env.test
        run: |
          cat <<EOF > .env.test
          PGHOST=localhost
          PGPORT=5432
          PGUSER=postgres
          PGPASSWORD=postgres
          PGDATABASE=delivery_bot_test
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/delivery_bot_test
          DELIVERY_UFS=
          EOF

      - run: npm test
